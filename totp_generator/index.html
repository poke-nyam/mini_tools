<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>安全なTOTPツール</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    input { padding: 0.5rem; width: 300px; }
    button { margin-left: 0.5rem; padding: 0.5rem 1rem; }
    #code { font-size: 2rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>TOTP ジェネレーター</h1>

  <div>
    <label>シークレット: <input type="text" id="secret" /></label>
    <button id="save">保存</button>
    <button id="load">読み込み</button>
  </div>

  <div id="code">⏳ TOTPコード: <span id="totp">-</span></div>

  <script>
    // Base32デコード関数
    function base32toUint8Array(base32) {
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
      let bits = '';
      base32.replace(/=+$/, '').toUpperCase().split('').forEach(char => {
        const val = alphabet.indexOf(char);
        if (val < 0) throw new Error("Invalid base32 character");
        bits += val.toString(2).padStart(5, '0');
      });
      const bytes = bits.match(/.{1,8}/g).map(b => parseInt(b.padEnd(8, '0'), 2));
      return new Uint8Array(bytes);
    }

    async function getKeyFromPassword(password, salt) {
      const encoder = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw", encoder.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      return await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256",
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encrypt(secret, password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(secret);
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await getKeyFromPassword(password, salt);
      const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, data);
      return {
        ciphertext: Array.from(new Uint8Array(encrypted)),
        salt: Array.from(salt),
        iv: Array.from(iv),
      };
    }

    async function decrypt(encrypted, password) {
      const decoder = new TextDecoder();
      const salt = new Uint8Array(encrypted.salt);
      const iv = new Uint8Array(encrypted.iv);
      const data = new Uint8Array(encrypted.ciphertext);
      const key = await getKeyFromPassword(password, salt);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
      return decoder.decode(decrypted);
    }

    function generateTOTP(secret, timeStep = 30) {
      const key = base32toUint8Array(secret);
      const counter = Math.floor(Date.now() / 1000 / timeStep);
      const buffer = new ArrayBuffer(8);
      const view = new DataView(buffer);
      view.setUint32(4, counter); // 上位4バイトは0でOK
      return crypto.subtle.importKey("raw", key, { name: "HMAC", hash: "SHA-1" }, false, ["sign"])
        .then(cryptoKey => crypto.subtle.sign("HMAC", buffer, cryptoKey))
        .then(signature => {
          const bytes = new Uint8Array(signature);
          const offset = bytes[bytes.length - 1] & 0xf;
          const binCode = ((bytes[offset] & 0x7f) << 24) |
                          ((bytes[offset + 1] & 0xff) << 16) |
                          ((bytes[offset + 2] & 0xff) << 8) |
                          (bytes[offset + 3] & 0xff);
          const otp = (binCode % 1_000_000).toString().padStart(6, '0');
          return otp;
        });
    }

    let currentSecret = null;

    function updateTOTP() {
      if (!currentSecret) return;
      generateTOTP(currentSecret)
        .then(code => document.getElementById("totp").textContent = code)
        .catch(() => document.getElementById("totp").textContent = "エラー");
    }

    setInterval(updateTOTP, 1000); // 毎秒更新（リアルタイム表示）

    document.getElementById("save").addEventListener("click", async () => {
      const secret = document.getElementById("secret").value.trim();
      if (!secret) return alert("シークレットを入力してください");
      const password = prompt("保存のためのパスワードを入力してください:");
      if (!password) return alert("パスワードが必要です");
      const encrypted = await encrypt(secret, password);
      localStorage.setItem("encryptedSecret", JSON.stringify(encrypted));
      alert("保存しました");
    });

    document.getElementById("load").addEventListener("click", async () => {
      const encrypted = JSON.parse(localStorage.getItem("encryptedSecret") || "{}");
      if (!encrypted.ciphertext) return alert("保存されたデータがありません");
      const password = prompt("復号のためのパスワードを入力してください:");
      if (!password) return alert("パスワードが必要です");
      try {
        const decrypted = await decrypt(encrypted, password);
        document.getElementById("secret").value = decrypted;
        currentSecret = decrypted;
        updateTOTP();
        alert("読み込み成功");
      } catch {
        alert("パスワードが違うか、データが壊れています");
      }
    });
  </script>
</body>
</html>
